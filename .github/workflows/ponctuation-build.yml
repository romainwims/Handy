name: "Build ponctuation dictée (macOS)"

# Unsigned macOS build of this fork, published as a GitHub release so the
# .dmg can be downloaded without a GitHub account. Upstream's build workflows
# require the maintainer's Apple and updater signing secrets, which a fork
# does not have.

on:
  push:
    branches: [ponctuation-dictee]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spoken-punctuation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      # text.rs only depends on these crates, so its unit tests run in a tiny
      # standalone crate instead of compiling the whole app.
      - name: Run text cleanup unit tests
        run: |
          CRATE="$RUNNER_TEMP/texttests"
          mkdir -p "$CRATE/src"
          cat > "$CRATE/Cargo.toml" <<'EOF'
          [package]
          name = "texttests"
          version = "0.0.0"
          edition = "2021"

          [dependencies]
          natural = "0.5.0"
          once_cell = "1"
          regex = "1"
          strsim = "0.11.0"
          EOF
          printf '#![allow(dead_code)]\n#[path = "%s/src-tauri/src/audio_toolkit/text.rs"]\nmod text;\n' "$GITHUB_WORKSPACE" > "$CRATE/src/lib.rs"
          cd "$CRATE" && cargo test

  # Upstream's reusable build.yml always exports APPLE_CERTIFICATE to
  # tauri-action (as an empty string when not signing), which makes Tauri
  # attempt a certificate import and fail. Building directly leaves it unset,
  # so Tauri falls back to the ad-hoc signature from tauri.conf.json.
  build:
    needs: spoken-punctuation-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-26" # Apple Silicon (M1 and above)
            target: "aarch64-apple-darwin"
          - platform: "macos-latest" # Intel
            target: "x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.platform }}-${{ matrix.target }}

      - name: Install frontend dependencies
        run: bun install

      # Same as upstream build.yml: there is no prebuilt ONNX Runtime for
      # Intel Macs, so link it dynamically and bundle the dylib.
      - name: Install ONNX Runtime (Intel)
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          ORT_VERSION="1.24.2"
          curl -L -o ort.tgz "https://blob.handy.computer/onnxruntime-osx-x86_64-${ORT_VERSION}.tgz"
          tar xzf ort.tgz
          ORT_DIR="$(pwd)/onnxruntime-osx-x86_64-${ORT_VERSION}"
          echo "ORT_LIB_LOCATION=$ORT_DIR/lib" >> $GITHUB_ENV
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> $GITHUB_ENV
          jq --arg lib "$ORT_DIR/lib/libonnxruntime.${ORT_VERSION}.dylib" \
            '.bundle.macOS.frameworks = [$lib]' \
            src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json

      - name: Build
        run: bun run tauri build --target ${{ matrix.target }}

      - name: Verify bundled dylibs (Intel)
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          APP=$(find src-tauri/target/${{ matrix.target }}/release/bundle/macos -name "*.app" -type d | head -1)
          otool -L "$APP/Contents/MacOS/handy" | grep '@rpath/' | awk '{print $1}' | while read dep; do
            libname=$(basename "$dep")
            if [ ! -f "$APP/Contents/Frameworks/$libname" ]; then
              echo "MISSING: $libname not found in Frameworks/"
              exit 1
            fi
            echo "OK: $libname"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: handy-ponctuation-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: handy-ponctuation-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t DMGS < <(find dist -name '*.dmg')
          if [ "${#DMGS[@]}" -eq 0 ]; then
            echo "No .dmg produced" >&2
            find dist >&2
            exit 1
          fi
          printf 'Publishing %s\n' "${DMGS[@]}"
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | head -1 | cut -d'"' -f4)
          gh release create "v${VERSION}-ponctuation.${{ github.run_number }}" "${DMGS[@]}" \
            --target "$GITHUB_SHA" \
            --title "Handy ${VERSION} + ponctuation dictée" \
            --notes-file .github/RELEASE_NOTES_PONCTUATION.md \
            --latest
